<!-- The toolchest itself, at favicon size: the gold 4Dwm titlebar over a
     paneled body with three menu items. Colors are Classic's title-active,
     panel and face roles. There is no wlRIX logo to use instead; the
     project's own mark is the typographic "wlRIX" wordmark, which does not
     survive being drawn at 16 pixels. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="1" y="1" width="30" height="30" fill="#c1c1c1"/>
  <rect x="1" y="1" width="30" height="9" fill="#a59f80"/>
  <rect x="1" y="1" width="30" height="2" fill="#d9d6c9"/>
  <rect x="1" y="8" width="30" height="2" fill="#635f4d"/>
  <rect x="4" y="13" width="24" height="4" fill="#999999"/>
  <rect x="4" y="13" width="24" height="1" fill="#e5e5e5"/>
  <rect x="4" y="16" width="24" height="1" fill="#545454"/>
  <rect x="4" y="19" width="24" height="4" fill="#999999"/>
  <rect x="4" y="19" width="24" height="1" fill="#e5e5e5"/>
  <rect x="4" y="22" width="24" height="1" fill="#545454"/>
  <rect x="4" y="25" width="24" height="4" fill="#999999"/>
  <rect x="4" y="25" width="24" height="1" fill="#e5e5e5"/>
  <rect x="4" y="28" width="24" height="1" fill="#545454"/>
  <rect x="0" y="0" width="32" height="32" fill="none" stroke="#000000" stroke-width="2"/>
</svg>
