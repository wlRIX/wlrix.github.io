# The toolchest's contents.
#
# The real toolchest builds its menus from a catalog rather than from a fixed
# list, so the site's navigation is data here too: adding a page means adding a
# line, not editing a template. Order is the order it appears in.
#
#   title:      the top-level label
#   items:      the flyout, in order
#   separator:  an etched rule between items, as the real menus use

